<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#FBF9F6" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* iPhone / mobile browsers:
         - overscroll-behavior: stops a drag at the end of a list from chaining to the page itself
           (iPhone Safari ignores "overflow: hidden" on body, so the whole app could otherwise bounce
           or move, and Android Chrome could pull-to-refresh and lose unsaved edits).
         - touch-action: manipulation: no double-tap zoom, so a quick double tap on a row or a button
           cannot leave the page zoomed in. Scrolling and pinch zoom still work.
         - text-size-adjust: keeps iOS from enlarging text when the phone is rotated. */
      html,
      body {
        overscroll-behavior: none;
      }
      /* Focus look of the text fields (Login, Register, Edit Profile, ...): no blue browser box; the
         frame of the field turns violet with a faint halo instead. The focus stays clearly visible. */
      input[data-lista-field]:focus {
        outline: none;
      }
      div:has(> input[data-lista-field]:focus) {
        border-color: rgba(106, 91, 214, 0.55) !important;
        background-color: #ffffff !important;
        box-shadow: 0 0 0 4px rgba(106, 91, 214, 0.13);
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
      }
      /* List rows: the trash is shown only when a mouse is present (computers) and the pointer is over
         the row; the drag handle gets a little brighter then. Phones never show these. */
      [data-lista-hover] {
        display: none !important;
      }
      @media (hover: hover) and (pointer: fine) {
        [data-lista-hover] {
          display: flex !important;
          opacity: 0;
          transition: opacity 0.15s ease;
        }
        [data-lista-row]:hover [data-lista-hover],
        [data-lista-row]:focus-within [data-lista-hover] {
          opacity: 1;
        }
        [data-lista-row]:hover [data-lista-grip] {
          opacity: 0.75 !important;
        }
      }
      html {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
